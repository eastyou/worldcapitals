[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "worldcapitals"
version = "0.1.0"
description = "世界国家与首都：中英查询、大洲分组与可打印练习页"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "geography", "capitals", "python", "teaching"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
worldcapitals = "worldcapitals.cli:main"

[tool.setuptools]
packages = ["worldcapitals"]
